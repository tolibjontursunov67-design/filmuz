<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film.uz | O'zbekcha Kino Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #e50914; --bg: #05070a; --border: rgba(255, 255, 255, 0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #fff; }

        header {
            display: grid; grid-template-columns: 200px 1fr 250px; align-items: center;
            padding: 15px 5%; background: #000; position: sticky; top: 0; z-index: 1000;
            border-bottom: 2px solid var(--accent);
        }
        .logo { font-size: 28px; font-weight: 900; color: var(--accent); text-decoration: none; }
        .search-box input { width: 100%; max-width: 450px; padding: 12px; border-radius: 25px; background: #1a1a1a; border: 1px solid #333; color: #fff; outline: none; display: block; margin: 0 auto; }
        
        .auth-zone { text-align: right; }
        .login-btn { background: var(--accent); color: #fff; padding: 10px 25px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; }
        .welcome-msg { display: none; color: #fff; font-weight: bold; }

        .wrapper { display: flex; padding: 30px 5%; gap: 30px; }
        .movies-section { flex: 3; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, 200px); gap: 20px; justify-content: start; }

        .card { width: 200px; background: #111; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); transition: 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-8px); border-color: var(--accent); }
        .img-box { position: relative; width: 100%; height: 280px; background: #222; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; font-size: 50px; color: #fff; }
        .card:hover .play-overlay { opacity: 1; }
        .card h4 { padding: 12px; text-align: center; font-size: 13px; color: #eee; min-height: 55px; line-height: 1.4; }

        .ads-sidebar { flex: 0.8; display: flex; flex-direction: column; gap: 15px; position: sticky; top: 100px; height: fit-content; }
        .ad-unit { width: 100%; height: 180px; background: #111; border-radius: 12px; border: 1px solid #333; overflow: hidden; }
        .ad-unit img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }

        .v-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; align-items: center; justify-content: center; }
        .v-box { width: 90%; max-width: 900px; aspect-ratio: 16/9; position: relative; border-radius: 15px; border: 2px solid var(--accent); background: #000; }
        iframe { width: 100%; height: 100%; border-radius: 13px; }
        .v-close { position: absolute; top: -55px; right: 0; color: #fff; font-size: 45px; cursor: pointer; background: none; border: none; }
    </style>
</head>
<body>

<header>
    <a href="#" class="logo">FILM.UZ</a>
    <div class="search-box"><input type="text" placeholder="Kino qidirish..." onkeyup="search(this.value)"></div>
    <div class="auth-zone">
        <button class="login-btn" id="lBtn" onclick="openLogin()">KIRISH</button>
        <span id="uName" class="welcome-msg"></span>

</header>

    const grid = document.getElementById('movieGrid');

    movieData.forEach((movie) => {
        grid.innerHTML += `

                <div class="img-box">
                    <img src="https://img.youtube.com/vi/${movie.id}/hqdefault.jpg">
                    <div class="play-overlay"><i class="fas fa-play"></i></div>

                <h4>${movie.title}</h4>
            </div>`;
    });

    function openYT(id) {
        document.getElementById('ytFrame').src = "https://www.youtube.com/embed/" + id + "?autoplay=1";
        document.getElementById('vModal').style.display = "flex";
    }
    function closeYT() {
        document.getElementById('vModal').style.display = "none";
        document.getElementById('ytFrame').src = "";
    }
    function search(v) {
        document.querySelectorAll('.card').forEach(c => {
            let title = c.getAttribute('data-title').toLowerCase();
            c.style.display = title.includes(v.toLowerCase()) ? 'block' : 'none';
        });
    }
    window.onclick = function(e) { if(e.target.className === 'v-modal') closeYT(); }
</script>
